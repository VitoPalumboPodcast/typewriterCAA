<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="only light" />
  <title>Macchina da scrivere simbolica – v2 accessibile</title>

  <style>
    /* =========================
       VARIABILI E BASE LAYOUT
       ========================= */
    :root{
      color-scheme: only light;
      --tile-size: 5.5rem;      /* dimensione base dei pulsanti/pedine */
      --gap-size: 0.5rem;       /* spaziatura tra pulsanti/pedine */
      --radius: .6rem;
      --fg: #111;
      --bg: #ffffff;
      --panel: #f6f6f6;
      --border: #cfcfcf;
      --accent: #0b6efd;
      --danger: #c0392b;
      --ok: #208b3a;
      --warn: #e67e22;
      --shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    *{ box-sizing: border-box; }
    html, body{ height:100%; background:#fff; }
    body{
      margin:0;
      color:var(--fg);
      background:var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji", "Segoe UI Symbol";
      line-height:1.35;
    }

    /* =========================
       APP BAR / STRUMENTI
       ========================= */
    .toolbar{
      position: sticky; top:0;
      z-index:10;
      background:var(--panel);
      border-bottom:1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .toolbar-inner{
      max-width:1100px;
      margin:auto;
      display:flex;
      gap:.5rem;
      align-items:center;
      padding:.5rem;
      flex-wrap:wrap;
    }
    .toolbar .group{
      display:flex; gap:.4rem; align-items:center; flex-wrap:wrap;
      background:#fff; border:1px solid var(--border); border-radius: var(--radius);
      padding:.35rem .5rem;
    }
    .toolbar label{ font-size:.9rem; opacity:.85; }

    button, .btn{
      appearance:none; border:1px solid var(--border);
      background:#fff; color:var(--fg);
      padding:.45rem .7rem; border-radius:.5rem; cursor:pointer;
      font-size:1rem; line-height:1;
    }
    button:hover{ filter:brightness(.94); }
    button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
    .btn-primary{ border-color:var(--accent); color:#fff; background:var(--accent); }
    .btn-ghost{ background:transparent; }
    .btn-danger{ border-color:var(--danger); color:#fff; background:var(--danger); }
    .btn-ok{ border-color:var(--ok); color:#fff; background:var(--ok); }
    .btn-warn{ border-color:var(--warn); color:#fff; background:var(--warn); }
    .segmented{
      display:flex; flex-wrap:wrap; max-width:100%;
      border:1px solid var(--border); border-radius:.5rem; overflow:hidden;
    }
    .segmented button{ border:0; border-right:1px solid var(--border); }
    .segmented button:last-child{ border-right:0; }
    .segmented button[aria-pressed="true"]{ background:var(--accent); color:#fff; }

    input[type="range"]{ accent-color: var(--accent); }

    /* =========================
       CONTENUTO
       ========================= */
    .container{ max-width:1100px; margin: 1rem auto; padding: 0 1rem; }

    /* Frase composta (token testuali) */
    #sentence{
      min-height: 3.2rem;
      padding: .6rem;
      border:1px solid var(--border);
      border-radius: var(--radius);
      background:#fff;
      font-size:1.4rem;
      display:flex; flex-wrap:wrap; gap:.35rem;
    }
    .token{
      padding:.1rem .4rem;
      border:2px solid #999;
      border-radius:.4rem;
      background:#fff;
      box-shadow: var(--shadow);
      align-self:center;
    }
    .token[data-cat="S"]{ border-color:#e74c3c; }
    .token[data-cat="V"]{ border-color:#2980b9; }
    .token[data-cat="O"]{ border-color:#27ae60; }
    .token[data-cat="X"]{ border-color:#8e44ad; }

    /* Output simbolico (simbolo + immagine) */
    #output{
      margin-top:.6rem;
      border:1px solid var(--border);
      border-radius: var(--radius);
      background:#fff;
      padding:.4rem;
      display:flex; flex-wrap:wrap; gap:.4rem;
      min-height:6rem;
    }
    .chip{
      display:flex; align-items:center; gap:.35rem;
      border:1px dashed #bbb; border-radius:.6rem;
      background:#fafafa; padding:.35rem .5rem;
    }
    .chip img{
      display:block; width:3.2rem; height:3.2rem; object-fit:cover; border-radius:.4rem;
      border:1px solid #ddd; background:#fff;
    }
    .chip .label{ font-size:1.2rem; }

    /* Griglia categorie / pulsanti */
    .section{ margin-top:1rem; }
    .section h2{
      font-size:1rem; font-weight:600; margin:.2rem 0 .5rem;
      color:#555; letter-spacing:.02em; text-transform:uppercase;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--tile-size), 1fr));
      gap: var(--gap-size);
    }
    .tile{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:.35rem; padding:.4rem;
      background:#fff; border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      cursor:pointer;
      min-height: calc(var(--tile-size) + 1.2rem);
    }
    .tile:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
    .tile img{
      width: calc(var(--tile-size) - 1.2rem);
      height: calc(var(--tile-size) - 1.2rem);
      object-fit: cover;
      border-radius:.4rem;
      border:1px solid #e1e1e1;
      background:#fff;
    }
    .tile .tlabel{ font-size:1rem; line-height:1.1; text-align:center; }

    /* Colori cornice per categorie */
    .tile.S{ border-color:#e74c3c; }
    .tile.V{ border-color:#2980b9; }
    .tile.O{ border-color:#27ae60; }
    .tile.X{ border-color:#8e44ad; }

    /* Info */
    .note{
      font-size:.92rem; color:#666; margin-top:.5rem;
    }

    footer{
      text-align:center;
      padding:1rem;
      margin-top:2rem;
      font-size:.9rem;
      background:var(--panel);
      border-top:1px solid var(--border);
    }

    /* Alto contrasto */
    .high-contrast{
      --fg:#000; --panel:#fff; --border:#555; --shadow:none;
      --accent:#0349aa;
    }
    .high-contrast .note, .high-contrast h2{ color:#111; }
  </style>
</head>
<body>

  <!-- =========================
       BARRA STRUMENTI ACCESSO
       ========================= -->
  <div class="toolbar" role="region" aria-label="Strumenti">
    <div class="toolbar-inner">

      <!-- Lettura -->
      <div class="group" role="group" aria-label="Lettura">
        <button class="btn-primary" id="btn-read" title="Leggi tutta la frase (Invio)">Leggi</button>
        <button class="btn-warn" id="btn-pause" title="Metti in pausa la lettura (P)">Pausa</button>
        <button class="btn-ok" id="btn-resume" title="Riprendi la lettura (R)">Riprendi</button>
        <button class="btn-danger" id="btn-stop" title="Ferma la lettura (S)">Stop</button>
      </div>

      <!-- Modifica frase -->
        <div class="group" role="group" aria-label="Modifica frase">
          <button id="btn-undo" title="Annulla ultimo token (Ctrl+Z)">Annulla</button>
          <button id="btn-clear" class="btn-ghost" title="Cancella frase">Cancella</button>
          <button id="btn-read-token" class="btn-ghost" title="Leggi token selezionato">Leggi token</button>
        </div>

        <!-- Scansione automatica -->
        <div class="group" role="group" aria-label="Scansione">
          <button id="btn-scan-start" class="btn-ghost" title="Avvia scansione automatica">Avvia</button>
          <button id="btn-scan-stop" class="btn-ghost" title="Ferma scansione">Ferma</button>
          <label for="scan-speed">Velocità</label>
          <input id="scan-speed" type="range" min="500" max="3000" step="100" value="1500" />
        </div>

        <!-- Aspetto / Accessibilità -->
        <div class="group" role="group" aria-label="Aspetto">
          <label for="size">Larghezza</label>
          <input id="size" type="range" min="4.5" max="8.5" step=".5" value="5.5" />
          <label for="gap">Spaziatura</label>
        <input id="gap" type="range" min="0.2" max="1.2" step=".1" value="0.5" />
        <button id="btn-contrast" class="btn-ghost" title="Alto contrasto (C)">Contrasto</button>
      </div>

      <!-- Filtri categorie -->
      <div class="group" role="group" aria-label="Categorie">
        <div class="segmented" id="filters" role="tablist" aria-label="Filtra categoria">
          <button data-filter="ALL" aria-pressed="true">Tutte</button>
          <button data-filter="S" aria-pressed="false">Soggetti</button>
          <button data-filter="V" aria-pressed="false">Verbi</button>
          <button data-filter="O" aria-pressed="false">Oggetti</button>
          <button data-filter="X" aria-pressed="false">Sociali/Altro</button>
          <button data-filter="P" aria-pressed="false">Persone</button>
          <button data-filter="A" aria-pressed="false">Azioni</button>
          <button data-filter="L" aria-pressed="false">Luoghi</button>
          <button data-filter="T" aria-pressed="false">Tempo</button>
          <button data-filter="E" aria-pressed="false">Emozioni</button>
        </div>
      </div>

    </div>
  </div>

  <div class="container">
    <!-- =========================
         FRASE + OUTPUT SIMBOLICO
         ========================= -->
    <div class="section" aria-live="polite" aria-label="Frase composta">
      <h2>Frase</h2>
      <div id="sentence"></div>
      <p id="speech-status" class="note" role="status" hidden></p>
      <div id="output" class="mt"></div>
      <p class="note">Suggerimento: clicca le pedine in basso. <kbd>Invio</kbd> legge tutta la frase. <kbd>Ctrl</kbd>+<kbd>Z</kbd> annulla l’ultimo token. Usa <em>Filtra categoria</em> per ridurre il carico visivo.</p>
    </div>

    <!-- =========================
         PALETTE PULSANTI
         ========================= -->
    <div class="section">
      <h2>Selettore</h2>
      <div id="grid" class="grid" role="grid" aria-label="Pulsanti comunicativi"></div>
    </div>
  </div>

  <script>
    /* ============================================================
       COSTANTI, UTILITIES, E DATI
       ============================================================ */

    // Prefisso assoluto per le immagini, come richiesto
    const BASE_URL = "https://www.vitopalumbo.it/INCLUSIONE/";

    // Esegue il join assoluto se serve
    const toAbsolute = (p) => {
      if (!p) return "";
      if (/^https?:\/\//i.test(p)) return p;
      return BASE_URL + p.replace(/^\/+/, "");
    };

    // Catalogo pulsanti (categoria: S=Subject, V=Verb, O=Object, X=Extra/Social)
    // Nota: per i verbi aggiuntivi non assumo esistenza di immagini → image: ""
    const CATALOG = [
      // SOGGETTI (S)
      { cat: "S", label: "Io", audio: "audio/1.mp3", image: "io.png" },

      // VERBI (V)
      { cat: "V", label: "voglio", audio: "audio/2.mp3", image: "volere.png" },
      { cat: "V", label: "vorrei", audio: "audio/3.mp3", image: "" },
      { cat: "V", label: "posso", audio: "audio/4.mp3", image: "" },
      { cat: "V", label: "non voglio", audio: "audio/5.mp3", image: "" },

      // OGGETTI (O) – elenco originario
      { cat: "O", label: "il panino", audio: "audio/6.mp3", image: "panino.jpg" },
      { cat: "O", label: "il pollo", audio: "audio/7.mp3", image: "pollo.jpg" },
      { cat: "O", label: "la pizza", audio: "audio/8.mp3", image: "pizza.jpg" },
      { cat: "O", label: "l'insalata", audio: "audio/9.mp3", image: "insalata.jpg" },
      { cat: "O", label: "la melanzana", audio: "audio/10.mp3", image: "melanzana.jpg" },
      { cat: "O", label: "l'arancia", audio: "audio/11.mp3", image: "arancia.jpg" },
      { cat: "O", label: "la banana", audio: "audio/12.mp3", image: "banana.jpg" },
      { cat: "O", label: "la mela", audio: "audio/13.mp3", image: "mela.jpg" },
      { cat: "O", label: "la carota", audio: "audio/14.mp3", image: "carota.jpg" },
      { cat: "O", label: "la caramella", audio: "audio/15.mp3", image: "caramella.jpg" },
      { cat: "O", label: "gli spaghetti", audio: "audio/16.mp3", image: "spaghetti.jpg" },
      { cat: "O", label: "il cioccolatino", audio: "audio/17.mp3", image: "cioccolatino.jpg" },
      { cat: "O", label: "il cappuccino", audio: "audio/18.mp3", image: "cappuccino.jpg" },
      { cat: "O", label: "le ciliegie", audio: "audio/19.mp3", image: "ciliegie.jpg" },

      // SOCIALI/EXTRA (X)
      { cat: "X", label: "per favore", audio: "audio/20.mp3", image: "" },
      { cat: "X", label: "grazie", audio: "audio/21.mp3", image: "" },
      { cat: "X", label: "aiuto", audio: "audio/22.mp3", image: "" },
      { cat: "X", label: "adesso", audio: "audio/23.mp3", image: "" },
      { cat: "X", label: "poi", audio: "audio/24.mp3", image: "" },

      // PERSONE (P)
      { cat: "P", label: "mamma", audio: "audio/25.mp3", image: "" },

      // AZIONI (A)
      { cat: "A", label: "dormire", audio: "audio/26.mp3", image: "" },

      // LUOGHI (L)
      { cat: "L", label: "casa", audio: "audio/27.mp3", image: "" },

      // TEMPO (T)
      { cat: "T", label: "oggi", audio: "audio/28.mp3", image: "" },

      // EMOZIONI (E)
      { cat: "E", label: "felice", audio: "audio/29.mp3", image: "" }
    ];

    // Colori cornice per chip/token per coerenza visiva
    const BORDER_BY_CAT = {
      S: "#e74c3c",
      V: "#2980b9",
      O: "#27ae60",
      X: "#8e44ad",
      P: "#f39c12",
      A: "#d35400",
      L: "#16a085",
      T: "#f1c40f",
      E: "#f012be"
    };

    // Stato applicativo
    const state = {
      tokens: [],                 // lista token {cat, label, audio, image}
      filter: "ALL",              // filtro categoria corrente
      scanActive: false,          // scansione automatica attiva?
      scanSpeed: 1500,            // intervallo scansione in ms
      scanIndex: -1,              // indice corrente nella griglia
      scanTimer: null             // handle setInterval
    };

    /* ============================================================
       COSTRUZIONE UI: GRIGLIA, TOKEN, CHIP
       ============================================================ */
    const gridEl     = document.getElementById("grid");
    const sentenceEl = document.getElementById("sentence");
    const outputEl   = document.getElementById("output");
    // controlli scansione
    const btnScanStart = document.getElementById("btn-scan-start");
    const btnScanStop  = document.getElementById("btn-scan-stop");
    const scanSpeedInput = document.getElementById("scan-speed");

    function buildGrid(){
      gridEl.innerHTML = "";
      const items = CATALOG.filter(it => state.filter==="ALL" ? true : it.cat===state.filter);
      for (const it of items){
        const b = document.createElement("button");
        b.className = `tile ${it.cat}`;
        b.type = "button";
        b.setAttribute("role","gridcell");
        b.setAttribute("aria-label", it.label);
        b.title = it.label;
        b.tabIndex = 0;

        // immagine (se esiste)
        if (it.image){
          const img = document.createElement("img");
          img.alt = it.label;
          img.loading = "lazy";
          img.decoding = "async";
          img.src = toAbsolute(it.image);
          img.onerror = () => { img.style.visibility="hidden"; }; // se 404, nascondi
          b.appendChild(img);
        }

        const lab = document.createElement("div");
        lab.className = "tlabel";
        lab.textContent = it.label;
        b.appendChild(lab);

        b.addEventListener("click", () => addToken(it));
        b.addEventListener("keydown", (e)=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); b.click(); } });

        gridEl.appendChild(b);
      }
      if (state.scanActive){
        state.scanIndex = -1;
        cycleFocus();
      }
    }

    function renderSentence(){
      sentenceEl.innerHTML = "";
      state.tokens.forEach(t => {
        const s = document.createElement("button");
        s.type = "button";
        s.className = "token";
        s.dataset.cat = t.cat;
        s.style.borderColor = BORDER_BY_CAT[t.cat] || "#999";
        s.textContent = t.label;
        s.title = "Ascolta " + t.label;
        s.addEventListener("click", () => playReading([t]));
        sentenceEl.appendChild(s);
      });
    }

    function renderOutput(){
      outputEl.innerHTML = "";
      state.tokens.forEach(t => {
        const box = document.createElement("button");
        box.type = "button";
        box.title = "Ascolta " + t.label;
        box.addEventListener("click", () => playReading([t]));
        box.className = "chip";
        box.style.borderColor = (BORDER_BY_CAT[t.cat] || "#bbb");

        if (t.image){
          const img = document.createElement("img");
          img.alt = t.label;
          img.src = toAbsolute(t.image);
          img.onerror = () => { img.remove(); }; // se fallisce, mostra solo etichetta
          box.appendChild(img);
        }

        const lab = document.createElement("div");
        lab.className = "label";
        lab.textContent = t.label;
        box.appendChild(lab);

        outputEl.appendChild(box);
      });
    }

    function addToken(item){
      state.tokens.push(item);
      renderSentence();
      renderOutput();
      playReading([item]);
    }

    function undoLast(){
      if (!state.tokens.length) return;
      state.tokens.pop();
      renderSentence(); renderOutput();
    }

    function clearAll(){
      state.tokens = [];
      renderSentence(); renderOutput();
    }

    /* ============================================================
       SCANSIONE AUTOMATICA GRIGLIA
       ============================================================ */
    function cycleFocus(){
      const btns = gridEl.querySelectorAll("button");
      if (!btns.length) return;
      state.scanIndex = (state.scanIndex + 1) % btns.length;
      btns[state.scanIndex].focus();
    }

    function startScan(){
      stopScan();
      state.scanActive = true;
      state.scanIndex = -1;
      cycleFocus();
      state.scanTimer = setInterval(cycleFocus, state.scanSpeed);
    }

    function stopScan(){
      state.scanActive = false;
      if (state.scanTimer){
        clearInterval(state.scanTimer);
        state.scanTimer = null;
      }
    }

    function updateScanSpeed(){
      state.scanSpeed = parseInt(scanSpeedInput.value, 10);
      localStorage.setItem("scanSpeed", state.scanSpeed);
      if (state.scanActive){
        startScan();
      }
    }

    btnScanStart.addEventListener("click", startScan);
    btnScanStop.addEventListener("click", stopScan);
    scanSpeedInput.addEventListener("input", updateScanSpeed);

    /* ============================================================
       LETTURA CON AUDIO ITALIANO
       ============================================================ */
    const player = new Audio();
    const speechStatus = document.getElementById("speech-status");
    let reading = null;

    function setSpeechStatus(message){
      speechStatus.textContent = message;
      speechStatus.hidden = !message;
    }

    function playCurrentClip(){
      const activeReading = reading;
      player.play().catch(error => {
        if (reading !== activeReading || error.name === "AbortError") return;
        stopSpeak();
        setSpeechStatus("Impossibile riprodurre l’audio. Ricarica la pagina e riprova.");
      });
    }

    function playNextClip(){
      const item = reading.tokens[reading.index++];
      if (!item){
        reading = null;
        return;
      }
      player.src = item.audio;
      playCurrentClip();
    }

    player.addEventListener("ended", () => {
      if (reading && player.ended) playNextClip();
    });

    function playReading(tokens){
      stopSpeak();
      setSpeechStatus("");
      reading = { tokens: [...tokens], index: 0 };
      playNextClip();
    }

    function pauseSpeak(){ player.pause(); }
    function resumeSpeak(){ if (reading && player.paused) playCurrentClip(); }
    function stopSpeak(){
      reading = null;
      player.pause();
    }

    function speakAll(){
      if (!state.tokens.length){
        setSpeechStatus("Aggiungi almeno una pedina alla frase per ascoltarla.");
        return;
      }
      playReading(state.tokens);
    }

    /* ============================================================
       CONTROLLI TOOLBAR
       ============================================================ */
    // Lettura
    document.getElementById("btn-read").addEventListener("click", speakAll);
    document.getElementById("btn-pause").addEventListener("click", pauseSpeak);
    document.getElementById("btn-resume").addEventListener("click", resumeSpeak);
    document.getElementById("btn-stop").addEventListener("click", stopSpeak);

    // Auto lettura on/off
    // Undo / Clear / Leggi token selezionato
    document.getElementById("btn-undo").addEventListener("click", undoLast);
    document.getElementById("btn-clear").addEventListener("click", clearAll);
    let selectedToken = null;
    sentenceEl.addEventListener("focusin", event => {
      selectedToken = event.target.closest(".token");
    });
    document.getElementById("btn-read-token").addEventListener("click", () => {
      if (selectedToken?.isConnected) selectedToken.click();
      else setSpeechStatus("Seleziona una parola nella frase per ascoltarla.");
    });

    // Slider dimensioni e spaziatura
    const size = document.getElementById("size");
    const gap  = document.getElementById("gap");
    function applySizes(){
      document.documentElement.style.setProperty("--tile-size", size.value+"rem");
      document.documentElement.style.setProperty("--gap-size", gap.value+"rem");
      localStorage.setItem("tileSize", size.value);
      localStorage.setItem("gapSize", gap.value);
    }
    size.addEventListener("input", applySizes);
    gap.addEventListener("input", applySizes);

    // Alto contrasto
    const btnContrast = document.getElementById("btn-contrast");
    function toggleContrast(){
      document.body.classList.toggle("high-contrast");
      localStorage.setItem("contrast", document.body.classList.contains("high-contrast") ? "1":"0");
    }
    btnContrast.addEventListener("click", toggleContrast);

    // Filtro categorie (segment control)
    const filters = document.getElementById("filters");
    filters.addEventListener("click", (e)=>{
      const btn = e.target.closest("button[data-filter]");
      if (!btn) return;
      state.filter = btn.dataset.filter;
      for (const b of filters.querySelectorAll("button[data-filter]")){
        b.setAttribute("aria-pressed", b===btn ? "true" : "false");
      }
      buildGrid();
    });

    /* ============================================================
       TASTI RAPIDI
       ============================================================ */
    document.addEventListener("keydown", (e)=>{
      if (state.scanActive){
        e.preventDefault();
        const focused = document.activeElement;
        if (focused && focused.classList.contains("tile")){
          focused.click();
        }
        return;
      }
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;

      if (e.defaultPrevented || (e.key === "Enter" && e.target.closest("button"))) return;

      if (e.key === "Enter"){
        e.preventDefault(); speakAll();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==="z"){
        e.preventDefault(); undoLast();
      } else if (e.key.toLowerCase()==="c"){ // contrasto
        toggleContrast();
      } else if (e.key.toLowerCase()==="p"){ // pausa
        pauseSpeak();
      } else if (e.key.toLowerCase()==="r"){ // riprendi
        resumeSpeak();
      } else if (e.key.toLowerCase()==="s"){ // stop
        stopSpeak();
      }
    });

    document.addEventListener("click", (e)=>{
      if (!state.scanActive) return;
      if (e.target.closest('.toolbar') || e.target.closest('#grid')) return;
      e.preventDefault();
      const focused = document.activeElement;
      if (focused && focused.classList.contains('tile')){
        focused.click();
      }
    });

    /* ============================================================
       PERSISTENZA PREFERENZE
       ============================================================ */
      (function restorePrefs(){
        const ts = localStorage.getItem("tileSize");
        const gs = localStorage.getItem("gapSize");
        const hc = localStorage.getItem("contrast");
        const ss = localStorage.getItem("scanSpeed");

        if (ts){ size.value = ts; }
        if (gs){ gap.value  = gs; }
        applySizes();
        if (hc==="1") document.body.classList.add("high-contrast");
        if (ss){
          scanSpeedInput.value = ss;
          updateScanSpeed();
        }
      })();

    /* ============================================================
       AVVIO
       ============================================================ */
    buildGrid();
    renderSentence();
    renderOutput();

  </script>
