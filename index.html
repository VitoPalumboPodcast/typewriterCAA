<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="only light" />
  <title>Macchina da scrivere simbolica – v2 accessibile</title>

  <style>
    /* =========================
       VARIABILI E BASE LAYOUT
       ========================= */
    :root{
      color-scheme: only light;
      --tile-size: 5.5rem;      /* dimensione base dei pulsanti/pedine */
      --gap-size: 0.5rem;       /* spaziatura tra pulsanti/pedine */
      --radius: .6rem;
      --fg: #111;
      --bg: #ffffff;
      --panel: #f6f6f6;
      --border: #cfcfcf;
      --accent: #075acb;
      --shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    *{ box-sizing: border-box; }
    html, body{ height:100%; background:#fff; }
    body{
      margin:0;
      color:var(--fg);
      background:var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji", "Segoe UI Symbol";
      line-height:1.35;
    }

    button{
      appearance:none;
      border:1px solid var(--border);
      background:#fff;
      color:var(--fg);
      min-width:44px;
      min-height:44px;
      padding:.55rem .75rem;
      border-radius:.55rem;
      font:inherit;
      cursor:pointer;
    }
    button:hover{ filter:brightness(.94); }
    button:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
    button:disabled{ color:#666; cursor:default; }
    button[aria-pressed="true"], .btn-primary{
      border-color:var(--accent);
      color:#fff;
      background:var(--accent);
    }
    .btn-primary:disabled{ background:#edf2fa; border-color:#d1dbe9; }
    input{ accent-color:var(--accent); }
    [hidden]{ display:none !important; }

    .container{ max-width:1100px; margin:auto; padding:0 1rem; }
    .composer{
      position:sticky;
      top:0;
      z-index:2;
      padding:.55rem 0 .65rem;
      background:#fff;
      border-bottom:1px solid var(--border);
    }
    .section-heading, .actions, .categories{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:.45rem;
    }
    .section-heading{ justify-content:space-between; }
    h1, h2{ font-size:1rem; margin:.25rem 0; }
    .settings-link{ border-color:transparent; color:#444; font-size:.86rem; }
    #sentence{
      display:flex;
      flex-wrap:wrap;
      gap:.4rem;
      min-height:3.25rem;
      max-height:clamp(3.25rem, 20dvh, 8rem);
      overflow:auto;
      align-content:flex-start;
      align-items:center;
      padding:.35rem;
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:var(--panel);
    }
    .sentence-word{ display:flex; align-items:center; gap:.35rem; padding:.25rem .5rem; }
    .sentence-word img{ width:2rem; height:2rem; object-fit:cover; border-radius:.3rem; }
    .actions{ margin-top:.5rem; }
    .actions button{ font-size:.9rem; }
    #btn-read{ min-width:6.8rem; font-weight:650; }
    #btn-clear{ margin-inline-start:auto; }
    .vocabulary{ margin-top:1rem; }
    .categories{ margin:.5rem 0 .75rem; }
    .categories button{
      display:inline-flex;
      align-items:center;
      gap:.4rem;
      background:#f0f2f5;
      font-weight:600;
    }
    .categories button[aria-pressed="true"]{
      color:#fff;
      background:var(--accent);
    }
    .category-icon{ font-size:1.15em; line-height:1; }
    .tile{ scroll-margin-block-start:min(15rem, 55dvh); }
    .tile.scanning{ outline:3px solid var(--accent); outline-offset:2px; }
    .settings{
      width:min(32rem, calc(100% - 2rem));
      max-height:calc(100% - 2rem);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:1rem;
      color:var(--fg);
      background:#fff;
    }
    .settings::backdrop{ background:rgb(0 0 0 / .38); }
    .settings fieldset{
      margin:.75rem 0 0;
      padding:.55rem .7rem;
      border:1px solid var(--border);
      border-radius:var(--radius);
    }
    .settings label{ display:flex; align-items:center; gap:.45rem; min-height:44px; }
    .settings input[type="range"]{ flex:1; min-width:0; }
    .category-options{ display:flex; flex-wrap:wrap; column-gap:1rem; }
    @media (max-height:450px){ .composer{ position:static; } }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--tile-size), 1fr));
      gap: var(--gap-size);
    }
    .tile{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:.35rem; padding:.4rem;
      background:#fff; border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      cursor:pointer;
      min-height: calc(var(--tile-size) + 1.2rem);
    }
    .tile:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
    .tile img{
      width: calc(var(--tile-size) - 1.2rem);
      height: calc(var(--tile-size) - 1.2rem);
      object-fit: cover;
      border-radius:.4rem;
      border:1px solid #e1e1e1;
      background:#fff;
    }
    .tile .tlabel{ font-size:1rem; line-height:1.1; text-align:center; }

    /* Colori cornice per categorie */
    .tile.S{ border-color:#e74c3c; }
    .tile.V{ border-color:#2980b9; }
    .tile.O{ border-color:#27ae60; }
    .tile.X{ border-color:#8e44ad; }

    /* Info */
    .note{
      font-size:.92rem; color:#666; margin-top:.5rem;
    }

    footer{
      text-align:center;
      padding:1rem;
      margin-top:2rem;
      font-size:.9rem;
      background:var(--panel);
      border-top:1px solid var(--border);
    }

    /* Alto contrasto */
    .high-contrast{
      --fg:#000; --panel:#fff; --border:#555; --shadow:none;
      --accent:#0349aa;
    }
    .high-contrast .note, .high-contrast h2{ color:#111; }
  </style>
</head>
<body>

  <main class="container">
    <section class="composer" aria-labelledby="sentence-title">
      <div class="section-heading">
        <h1 id="sentence-title">Frase</h1>
        <button class="settings-link" id="btn-settings" type="button" aria-haspopup="dialog">Impostazioni di accesso</button>
      </div>
      <div id="sentence" aria-live="polite" aria-label="Frase composta"></div>
      <div class="actions" role="group" aria-label="Azioni sulla frase">
        <button class="btn-primary" id="btn-read" type="button">Leggi frase</button>
        <button id="btn-undo" type="button">Togli ultima parola</button>
        <button id="btn-clear" type="button">Nuova frase</button>
        <button id="btn-restore" type="button" hidden>Recupera frase</button>
        <button id="btn-pause" type="button" hidden>Pausa</button>
      </div>
      <p id="speech-status" class="note" role="status" hidden></p>
    </section>

    <section class="vocabulary" aria-labelledby="words-title">
      <div class="section-heading">
        <h2 id="words-title">Parole</h2>
        <button id="btn-scan" type="button" hidden>Avvia scansione</button>
      </div>
      <div class="categories" id="filters" role="group" aria-label="Categorie"></div>
      <div id="grid" class="grid" role="group" aria-label="Caselle di comunicazione"></div>
    </section>
  </main>

  <dialog class="settings" id="access-settings" aria-labelledby="settings-title">
    <form method="dialog">
      <div class="section-heading">
        <h2 id="settings-title">Impostazioni di accesso</h2>
        <button type="submit" autofocus>Chiudi</button>
      </div>
      <fieldset>
        <legend>Aspetto</legend>
        <label>Dimensione caselle <input id="size" type="range" min="4.5" max="8.5" step=".5" value="5.5"></label>
        <label>Spaziatura <input id="gap" type="range" min="0.2" max="1.2" step=".1" value="0.5"></label>
        <label><input id="contrast" type="checkbox"> Alto contrasto</label>
      </fieldset>
      <fieldset>
        <legend>Categorie visibili</legend>
        <div class="category-options" id="category-options"></div>
      </fieldset>
      <fieldset>
        <legend>Lettura e scansione</legend>
        <label><input id="show-pause" type="checkbox"> Mostra Pausa e Riprendi</label>
        <label><input id="enable-scan" type="checkbox"> Mostra il comando di scansione</label>
        <label>Intervallo di scansione <input id="scan-speed" type="range" min="500" max="3000" step="100" value="1500"></label>
        <output id="scan-interval" for="scan-speed"></output>
      </fieldset>
    </form>
  </dialog>

  <script>
    /* ============================================================
       COSTANTI, UTILITIES, E DATI
       ============================================================ */

    // Prefisso assoluto per le immagini, come richiesto
    const BASE_URL = "https://www.vitopalumbo.it/INCLUSIONE/";

    // Esegue il join assoluto se serve
    const toAbsolute = (p) => {
      if (!p) return "";
      if (/^https?:\/\//i.test(p)) return p;
      return BASE_URL + p.replace(/^\/+/, "");
    };

    // Catalogo pulsanti (categoria: S=Subject, V=Verb, O=Object, X=Extra/Social)
    // Nota: per i verbi aggiuntivi non assumo esistenza di immagini → image: ""
    const CATALOG = [
      // SOGGETTI (S)
      { cat: "S", label: "Io", audio: "audio/1.mp3", image: "io.png" },

      // VERBI (V)
      { cat: "V", label: "voglio", audio: "audio/2.mp3", image: "volere.png" },
      { cat: "V", label: "vorrei", audio: "audio/3.mp3", image: "" },
      { cat: "V", label: "posso", audio: "audio/4.mp3", image: "" },
      { cat: "V", label: "non voglio", audio: "audio/5.mp3", image: "" },

      // OGGETTI (O) – elenco originario
      { cat: "O", label: "il panino", audio: "audio/6.mp3", image: "panino.jpg" },
      { cat: "O", label: "il pollo", audio: "audio/7.mp3", image: "pollo.jpg" },
      { cat: "O", label: "la pizza", audio: "audio/8.mp3", image: "pizza.jpg" },
      { cat: "O", label: "l'insalata", audio: "audio/9.mp3", image: "insalata.jpg" },
      { cat: "O", label: "la melanzana", audio: "audio/10.mp3", image: "melanzana.jpg" },
      { cat: "O", label: "l'arancia", audio: "audio/11.mp3", image: "arancia.jpg" },
      { cat: "O", label: "la banana", audio: "audio/12.mp3", image: "banana.jpg" },
      { cat: "O", label: "la mela", audio: "audio/13.mp3", image: "mela.jpg" },
      { cat: "O", label: "la carota", audio: "audio/14.mp3", image: "carota.jpg" },
      { cat: "O", label: "la caramella", audio: "audio/15.mp3", image: "caramella.jpg" },
      { cat: "O", label: "gli spaghetti", audio: "audio/16.mp3", image: "spaghetti.jpg" },
      { cat: "O", label: "il cioccolatino", audio: "audio/17.mp3", image: "cioccolatino.jpg" },
      { cat: "O", label: "il cappuccino", audio: "audio/18.mp3", image: "cappuccino.jpg" },
      { cat: "O", label: "le ciliegie", audio: "audio/19.mp3", image: "ciliegie.jpg" },

      // SOCIALI/EXTRA (X)
      { cat: "X", label: "per favore", audio: "audio/20.mp3", image: "" },
      { cat: "X", label: "grazie", audio: "audio/21.mp3", image: "" },
      { cat: "X", label: "aiuto", audio: "audio/22.mp3", image: "" },
      { cat: "X", label: "adesso", audio: "audio/23.mp3", image: "" },
      { cat: "X", label: "poi", audio: "audio/24.mp3", image: "" },

      // PERSONE (P)
      { cat: "P", label: "mamma", audio: "audio/25.mp3", image: "" },

      // AZIONI (A)
      { cat: "A", label: "dormire", audio: "audio/26.mp3", image: "" },

      // LUOGHI (L)
      { cat: "L", label: "casa", audio: "audio/27.mp3", image: "" },

      // TEMPO (T)
      { cat: "T", label: "oggi", audio: "audio/28.mp3", image: "" },

      // EMOZIONI (E)
      { cat: "E", label: "felice", audio: "audio/29.mp3", image: "" }
    ];

    // Colori cornice per chip/token per coerenza visiva
    const BORDER_BY_CAT = {
      S: "#e74c3c",
      V: "#2980b9",
      O: "#27ae60",
      X: "#8e44ad",
      P: "#f39c12",
      A: "#d35400",
      L: "#16a085",
      T: "#f1c40f",
      E: "#f012be"
    };

    // Stato applicativo
    const state = {
      clearedPhrase: null,
      tokens: [],                 // lista token {cat, label, audio, image}
      activeFilters: new Set(),
      scanActive: false,          // scansione automatica attiva?
      scanSpeed: 1500,            // intervallo scansione in ms
      scanIndex: -1,              // indice corrente nella griglia
      scanTimer: null             // handle setInterval
    };

    /* ============================================================
       GRIGLIA E FRASE
       ============================================================ */
    const gridEl     = document.getElementById("grid");
    const sentenceEl = document.getElementById("sentence");
    const btnUndo = document.getElementById("btn-undo");
    const btnClear = document.getElementById("btn-clear");
    const btnRestore = document.getElementById("btn-restore");
    const btnScan = document.getElementById("btn-scan");
    const scanSpeedInput = document.getElementById("scan-speed");

    function buildGrid(){
      gridEl.innerHTML = "";
      const activeCategories = new Set([...state.activeFilters].flatMap(value => FILTERS[value].cats));
      const items = CATALOG.filter(it => !activeCategories.size || activeCategories.has(it.cat));
      for (const it of items){
        const b = document.createElement("button");
        b.className = `tile ${it.cat}`;
        b.type = "button";
        b.setAttribute("aria-label", it.label);
        b.title = it.label;

        // immagine (se esiste)
        if (it.image){
          const img = document.createElement("img");
          img.alt = it.label;
          img.loading = "lazy";
          img.decoding = "async";
          img.src = toAbsolute(it.image);
          img.onerror = () => { img.style.visibility="hidden"; }; // se 404, nascondi
          b.appendChild(img);
        }

        const lab = document.createElement("div");
        lab.className = "tlabel";
        lab.textContent = it.label;
        b.appendChild(lab);

        b.addEventListener("click", () => addToken(it));

        gridEl.appendChild(b);
      }
      if (state.scanActive){
        state.scanIndex = -1;
        cycleFocus();
      }
    }

    function renderSentence(){
      sentenceEl.replaceChildren();
      for (const token of state.tokens){
        const word = document.createElement("button");
        word.type = "button";
        word.className = "sentence-word";
        word.style.borderColor = BORDER_BY_CAT[token.cat] || "#999";
        word.title = "Ascolta " + token.label;
        if (token.image){
          const image = document.createElement("img");
          image.alt = "";
          image.src = toAbsolute(token.image);
          image.onerror = () => image.remove();
          word.appendChild(image);
        }
        word.append(token.label);
        word.addEventListener("click", () => playReading([token]));
        sentenceEl.appendChild(word);
      }
      sentenceEl.scrollTop = sentenceEl.scrollHeight;
      btnUndo.disabled = btnClear.disabled = !state.tokens.length;
      btnRestore.hidden = !state.clearedPhrase;
      updateReadControls();
    }

    function addToken(item){
      state.tokens.push(item);
      renderSentence();
      playReading([item]);
    }

    function undoLast(){
      if (!state.tokens.length) return;
      stopSpeak();
      state.tokens.pop();
      const restoreFocus = document.activeElement === btnUndo && !state.tokens.length;
      renderSentence();
      if (restoreFocus) focusVocabulary();
    }

    function clearAll(){
      if (!state.tokens.length) return;
      stopSpeak();
      state.clearedPhrase = state.tokens;
      state.tokens = [];
      renderSentence();
      btnRestore.focus({preventScroll:true});
    }

    function restorePhrase(){
      if (!state.clearedPhrase) return;
      stopSpeak();
      const currentPhrase = state.tokens;
      state.tokens = state.clearedPhrase;
      state.clearedPhrase = currentPhrase.length ? currentPhrase : null;
      renderSentence();
      btnRead.focus({preventScroll:true});
    }

    function focusVocabulary(){
      const first = gridEl.querySelector("button");
      first?.focus({preventScroll:true});
    }

    /* ============================================================
       SCANSIONE AUTOMATICA GRIGLIA
       ============================================================ */
    function cycleFocus(){
      const tiles = gridEl.querySelectorAll("button");
      const previous = gridEl.querySelector(".scanning");
      const moveFocus = gridEl.contains(document.activeElement);
      previous?.classList.remove("scanning");
      if (!tiles.length) return;
      state.scanIndex = (state.scanIndex + 1) % tiles.length;
      const tile = tiles[state.scanIndex];
      tile.classList.add("scanning");
      if (moveFocus) {
        tile.focus({preventScroll:true});
        tile.scrollIntoView({block:"nearest"});
      }
    }

    function startScan(){
      stopScan();
      state.scanActive = true;
      btnScan.textContent = "Ferma scansione";
      focusVocabulary();
      cycleFocus();
      state.scanTimer = setInterval(cycleFocus, state.scanSpeed);
    }

    function stopScan(){
      state.scanActive = false;
      state.scanIndex = -1;
      btnScan.textContent = "Avvia scansione";
      gridEl.querySelector(".scanning")?.classList.remove("scanning");
      clearInterval(state.scanTimer);
      state.scanTimer = null;
    }

    function updateScanSpeed(){
      state.scanSpeed = Number(scanSpeedInput.value);
      const seconds = (state.scanSpeed / 1000).toLocaleString("it-IT");
      document.getElementById("scan-interval").textContent = seconds + " s";
      localStorage.setItem("scanSpeed", scanSpeedInput.value);
    }

    btnScan.addEventListener("click", () => {
      if (state.scanActive) stopScan();
      else startScan();
    });
    scanSpeedInput.addEventListener("input", updateScanSpeed);

    /* ============================================================
       LETTURA CON AUDIO ITALIANO
       ============================================================ */
    const player = new Audio();
    const speechStatus = document.getElementById("speech-status");
    let reading = null;
    const btnRead = document.getElementById("btn-read");
    const btnPause = document.getElementById("btn-pause");
    const showPause = document.getElementById("show-pause");

    function updateReadControls(){
      const readingPhrase = Boolean(reading?.phrase);
      btnRead.textContent = readingPhrase ? "Ferma" : "Leggi frase";
      btnRead.disabled = !readingPhrase && !state.tokens.length;
      if ((!showPause.checked || !readingPhrase) && document.activeElement === btnPause){
        btnRead.focus({preventScroll:true});
      }
      btnPause.hidden = !showPause.checked || !readingPhrase;
      btnPause.textContent = reading?.paused ? "Riprendi" : "Pausa";
    }

    function setSpeechStatus(message){
      speechStatus.textContent = message;
      speechStatus.hidden = !message;
    }

    function playCurrentClip(){
      const activeReading = reading;
      player.play().catch(error => {
        if (reading !== activeReading || error.name === "AbortError") return;
        stopSpeak();
        setSpeechStatus("Impossibile riprodurre l’audio. Ricarica la pagina e riprova.");
      });
    }

    function playNextClip(){
      const item = reading.tokens[reading.index++];
      if (!item){
        stopSpeak();
        return;
      }
      player.src = item.audio;
      playCurrentClip();
    }

    player.addEventListener("ended", () => {
      if (reading && !reading.paused && player.ended) playNextClip();
    });

    function playReading(tokens, phrase = false){
      stopSpeak();
      setSpeechStatus("");
      reading = { tokens: [...tokens], index: 0, phrase, paused:false };
      updateReadControls();
      playNextClip();
    }

    function togglePause(){
      if (!reading?.phrase) return;
      reading.paused = !reading.paused;
      if (reading.paused) player.pause();
      else if (player.ended) playNextClip();
      else playCurrentClip();
      updateReadControls();
    }

    function stopSpeak(){
      reading = null;
      player.pause();
      updateReadControls();
    }

    function speakAll(){
      if (reading?.phrase) stopSpeak();
      else if (state.tokens.length) playReading(state.tokens, true);
    }

    btnRead.addEventListener("click", speakAll);
    btnPause.addEventListener("click", togglePause);
    btnUndo.addEventListener("click", undoLast);
    btnClear.addEventListener("click", clearAll);
    btnRestore.addEventListener("click", restorePhrase);

    // Slider dimensioni e spaziatura
    const size = document.getElementById("size");
    const gap  = document.getElementById("gap");
    function applySizes(){
      document.documentElement.style.setProperty("--tile-size", size.value+"rem");
      document.documentElement.style.setProperty("--gap-size", gap.value+"rem");
      localStorage.setItem("tileSize", size.value);
      localStorage.setItem("gapSize", gap.value);
    }
    size.addEventListener("input", applySizes);
    gap.addEventListener("input", applySizes);

    const settings = document.getElementById("access-settings");
    const contrast = document.getElementById("contrast");
    const enableScan = document.getElementById("enable-scan");
    const filters = document.getElementById("filters");
    const categoryOptions = document.getElementById("category-options");
    const FILTERS = {
      FOOD:{ label:"Cibo", icon:"🍎", cats:["O"] },
      PEOPLE:{ label:"Persone", icon:"👥", cats:["S","P"] },
      ACTIONS:{ label:"Azioni", icon:"🚶", cats:["V","A"] },
      SOCIAL:{ label:"Conversazione", icon:"💬", cats:["X"] },
      PLACES:{ label:"Luoghi", icon:"🏠", cats:["L"] },
      TIME:{ label:"Tempo", icon:"🕒", cats:["T"] },
      FEELINGS:{ label:"Emozioni", icon:"🙂", cats:["E"] }
    };

    function updateFilters(){
      for (const button of filters.querySelectorAll("button")){
        const value = button.dataset.filter;
        const pressed = value === "ALL" ? !state.activeFilters.size : state.activeFilters.has(value);
        button.setAttribute("aria-pressed", String(pressed));
      }
      buildGrid();
    }

    function toggleFilter(value){
      if (value === "ALL") state.activeFilters.clear();
      else if (state.activeFilters.has(value)) state.activeFilters.delete(value);
      else state.activeFilters.add(value);
      updateFilters();
    }

    function renderFilters(){
      const enabled = [...categoryOptions.querySelectorAll("input:checked")].map(input => input.value);
      state.activeFilters = new Set([...state.activeFilters].filter(value => enabled.includes(value)));
      filters.replaceChildren();
      filters.hidden = !enabled.length;
      for (const value of ["ALL", ...enabled]){
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.filter = value;
        const category = value === "ALL" ? { label:"Tutte", icon:"▦" } : FILTERS[value];
        const icon = document.createElement("span");
        icon.className = "category-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = category.icon;
        button.append(icon, category.label);
        button.addEventListener("click", () => toggleFilter(value));
        filters.appendChild(button);
      }
      localStorage.setItem("visibleCategories", enabled.join(","));
      updateFilters();
    }

    function applyContrast(){
      document.body.classList.toggle("high-contrast", contrast.checked);
      localStorage.setItem("contrast", contrast.checked ? "1" : "0");
    }

    document.getElementById("btn-settings").addEventListener("click", () => {
      stopScan();
      settings.showModal();
    });
    contrast.addEventListener("change", applyContrast);
    showPause.addEventListener("change", () => {
      localStorage.setItem("showPause", showPause.checked ? "1" : "0");
      updateReadControls();
    });
    enableScan.addEventListener("change", () => {
      localStorage.setItem("enableScan", enableScan.checked ? "1" : "0");
      btnScan.hidden = !enableScan.checked;
    });
    categoryOptions.addEventListener("change", renderFilters);

    document.addEventListener("keydown", event => {
      if (settings.open || event.defaultPrevented) return;
      if (state.scanActive && event.key === "Escape"){
        stopScan();
        btnScan.focus({preventScroll:true});
      } else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z"){
        event.preventDefault();
        if (state.tokens.length) undoLast();
        else restorePhrase();
      } else if (event.key === "Enter" && !event.target.closest("button, input, a")){
        event.preventDefault();
        speakAll();
      }
    });

    const savedCategories = (localStorage.getItem("visibleCategories") ?? "FOOD,PEOPLE").split(",");
    for (const [value, category] of Object.entries(FILTERS)){
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "checkbox";
      input.value = value;
      input.checked = savedCategories.includes(value);
      label.append(input, category.label);
      categoryOptions.appendChild(label);
    }

    size.value = localStorage.getItem("tileSize") || size.value;
    gap.value = localStorage.getItem("gapSize") || gap.value;
    scanSpeedInput.value = localStorage.getItem("scanSpeed") || scanSpeedInput.value;
    contrast.checked = localStorage.getItem("contrast") === "1";
    showPause.checked = localStorage.getItem("showPause") === "1";
    enableScan.checked = localStorage.getItem("enableScan") === "1";
    btnScan.hidden = !enableScan.checked;
    applySizes();
    applyContrast();
    updateScanSpeed();
    renderFilters();
    renderSentence();

  </script>
